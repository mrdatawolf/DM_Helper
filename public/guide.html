<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player's Guide - Amber Campaign</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navigation.css">
    <style>
        body {
            background: #000;
            color: #dde1e7;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vmin;
            height: 60vmin;
            background-image: url('/logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.07;
            z-index: 0;
            pointer-events: none;
        }

        .guide-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background: transparent;
            position: relative;
            z-index: 1;
        }

        .guide-header {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: white;
            padding: 30px;
            margin-bottom: 40px;
            text-align: center;
        }

        .guide-header h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #3498db 0%, #8e44ad 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .guide-header p {
            margin: 0;
            opacity: 0.75;
            font-size: 1.1rem;
        }

        .guide-content {
            line-height: 1.8;
            font-size: 1.05rem;
        }

        .guide-content h2 {
            color: #5dade2;
            margin-top: 40px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(93, 173, 226, 0.25);
        }

        .guide-content h3 {
            color: #a29bfe;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .guide-content h4 {
            color: #74b9ff;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        #guide-content h1, #guide-content h2,
        #guide-content h3, #guide-content h4 {
            scroll-margin-top: 80px;
        }

        .guide-content code {
            background: rgba(255, 255, 255, 0.07);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.95rem;
            color: #81ecec;
        }

        .guide-content pre {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            border-left: 4px solid var(--accent);
        }

        .guide-content pre code {
            background: none;
            padding: 0;
        }

        .guide-content ul, .guide-content ol {
            margin: 15px 0;
            padding-left: 30px;
        }

        .guide-content li {
            margin: 8px 0;
        }

        .guide-content blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 20px;
            margin: 20px 0;
            color: #a0aab4;
            font-style: italic;
        }

        .guide-content a {
            color: #5dade2;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s ease;
        }

        .guide-content a:hover {
            border-bottom-color: #5dade2;
        }

        .guide-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .guide-content th, .guide-content td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .guide-content th {
            background: rgba(255, 255, 255, 0.06);
            font-weight: 600;
            color: #5dade2;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
        }

        .toc {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 8px;
            margin: 30px 0;
        }

        .toc h3 {
            margin-top: 0;
            color: #5dade2;
        }

        .toc ul {
            margin: 10px 0;
            padding-left: 20px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- Navigation will be injected here -->
    <script src="/js/load-navigation.js"></script>
    <script src="/js/navigation.js"></script>

    <div class="guide-container">
        <div class="guide-header">
            <h1>Player's Guide</h1>
            <p>Amber Campaign - The Shattering of the Liminal</p>
        </div>

        <div id="guide-content" class="guide-content">
            Loading guide...
        </div>
    </div>

    <script>
        // Fetch and render the markdown guide
        fetch('/PLAYER_GUIDE.md')
            .then(response => response.text())
            .then(markdown => {
                // Configure marked for better rendering
                marked.setOptions({
                    breaks: true,
                    gfm: true
                });

                // Render markdown to HTML
                const html = marked.parse(markdown);
                document.getElementById('guide-content').innerHTML = html;

                // Stamp IDs on headings so TOC anchor links resolve.
                // marked v5+ dropped automatic heading IDs; we replicate GFM slug rules:
                //   lowercase → remove & → remove other punctuation → each space → dash
                function headingSlug(text) {
                    return text
                        .toLowerCase()
                        .replace(/&/g, '')
                        .replace(/[^\w\s-]/g, '')
                        .replace(/ /g, '-')
                        .replace(/^-+|-+$/g, '');
                }
                document.querySelectorAll('#guide-content h1, #guide-content h2, #guide-content h3, #guide-content h4').forEach(h => {
                    if (!h.id) h.id = headingSlug(h.textContent);
                });

                // Smooth scroll for anchor links
                document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                    anchor.addEventListener('click', function (e) {
                        e.preventDefault();
                        const target = document.querySelector(this.getAttribute('href'));
                        if (target) {
                            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    });
                });
            })
            .catch(error => {
                document.getElementById('guide-content').innerHTML =
                    '<p style="color: red;">Error loading guide. Please contact your DM.</p>';
                console.error('Error loading guide:', error);
            });
    </script>
</body>
</html>
